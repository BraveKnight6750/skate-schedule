name: Update Skate Schedule

on:
  schedule:
    - cron: '0 * * * *'  # runs every hour
  workflow_dispatch:      # allows manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true 

      - name: Run Open Hockey scraper
        run: uv run open_hockey.py

      - name: Run Public Skate scraper
        run: uv run public_skates.py
        
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add open_hockey.ics public_skates.ics
          git diff-index --quiet HEAD || git commit -m "Updated Public Skates and Open Hockey"
          git push
